name: Build Tests

on:
  push:
    # feature branches too: this workflow now covers the plugin, and a plugin that only compiles on
    # master is a plugin that breaks on every branch that has not been merged yet
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        config:
          - { os: windows-latest, build_type: Release, shell: bash, compiler: msvc, extra_settings: '-A Win32' }
          - { os: windows-latest, build_type: Debug, shell: bash, compiler: msvc, extra_settings: '-A Win32' }
          #- { os: windows-latest, build_type: Release, shell: bash, compiler: msvc, extra_settings: '-A x64' }
          #- { os: windows-latest, build_type: Debug, shell: bash, compiler: msvc, extra_settings: '-A x64' }
          - { os: windows-latest, build_type: Release, shell: "msys2 {0}", compiler: mingw, extra_settings: '-G "MSYS Makefiles"' }
          - { os: windows-latest, build_type: Debug, shell: "msys2 {0}", compiler: mingw, extra_settings: '-G "MSYS Makefiles"' }
          - { os: macos-latest, build_type: Release, shell: bash }
          - { os: macos-latest, build_type: Debug, shell: bash }
          - { os: ubuntu-latest, build_type: Release, shell: bash }
          - { os: ubuntu-latest, build_type: Debug, shell: bash }
      fail-fast: false

    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Configure
      run: |
        # The dependencies are vendored source in this repository (libs/libvgm, libs/inih,
        # libs/wingetopt - no submodules to fetch), and zlib is fetched and built by libvgm's own
        # CMake. The GUI plugin is a Windows target, so it stays off here: the CI covers the
        # command-line player across the compilers.
        CMAKE_OPTS="$CMAKE_OPTS -DTOYBOX_BUILD_PLUGIN=OFF"

        cmake ${{ matrix.config.extra_settings }} \
          -B ${GITHUB_WORKSPACE}/build \
          -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/install \
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
          ${CMAKE_OPTS}

    - name: Build
      run: |
        cmake \
          --build ${GITHUB_WORKSPACE}/build \
          --config ${{ matrix.config.build_type }} \
          --parallel 2

    - name: Install
      run: |
        cmake \
          --install ${GITHUB_WORKSPACE}/build \
          --config ${{ matrix.config.build_type }}

  # The matrix above builds the command-line player across compilers with the plugin switched off,
  # which meant the 7k lines that contain the whole UI were never compiled anywhere but on the
  # machine of whoever was editing them. This job builds the plugin and its console tests on all
  # three platforms and runs them.
  #
  # It is deliberately on every push rather than only on a tag: the plugin had never been built on
  # macOS or Linux at all, so a platform that cannot build it has to be found while there is still
  # time to fix it - a tag is the wrong moment to discover it. The release workflow builds the same
  # three platforms again from the tagged commit.
  plugin-tests:
    name: Plugin and console tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'powershell' || 'bash' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      # JUCE needs these to build on Linux at all, and xvfb-run gives the two GUI tests a display to
      # start against - a headless runner has none, and ScopedJuceInitialiser_GUI wants one.
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb

    - name: Build the plugin and run the console tests (Windows)
      # The same command a developer runs locally. The test targets are EXCLUDE_FROM_ALL, so they
      # are named; -Test then runs the ones that were built and fails the job when one fails.
      #
      #   vgm_core_test   the mixer maths against analytically known levels, the two volume stages,
      #                   seek/end, the output routing, and the startup-argument rule
      #   vgm_ui_test     the button pixels (shadow, hairline, focus ring, glow, press)
      #   vgm_app_test    the window itself: constructed headless, laid out, dumped as text
      #
      # vgm_mixer_test is deliberately absent: its sample-exact gate renders a real song twice and
      # this repository ships no song, so it stays a local gate (-Test -TestSong <file>).
      if: matrix.os == 'windows-latest'
      run: .\build.ps1 -Target vgm_core_test,vgm_ui_test,vgm_app_test -Test

    - name: Build the plugin (macOS)
      if: matrix.os == 'macos-latest'
      # The same steps in plain CMake: build.ps1 is a PowerShell script with MSVC assumptions.
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel 3
        cmake --build build --target vgm_core_test vgm_ui_test vgm_app_test --parallel 3

    - name: Run the console tests (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        ./build/plugin/vgm_core_test
        ./build/plugin/vgm_ui_test
        ./build/plugin/vgm_app_test plugin/Tests/scripts/window-basics.txt

    - name: Build the plugin (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel 3
        cmake --build build --target vgm_core_test vgm_ui_test vgm_app_test --parallel 3

    - name: Run the console tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        ./build/plugin/vgm_core_test
        xvfb-run -a ./build/plugin/vgm_ui_test
        xvfb-run -a ./build/plugin/vgm_app_test plugin/Tests/scripts/window-basics.txt
