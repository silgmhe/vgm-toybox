name: Build Tests

on:
  # master only. Each push used to start all eight jobs - three of the player, five of the plugin,
  # two of them on arm64 - so a day of work on a feature branch left a wall of runs, and the runs
  # that mattered were buried under pushes that were already superseded.
  #
  # The old argument for every branch - a plugin that only compiles on master breaks on every
  # branch that has not been merged yet - is answered by asking for a run before a merge instead of
  # starting one on every push:
  #
  #     gh workflow run "Build Tests" --ref feature/whatever
  push:
    branches: [ master ]
  # No pull_request trigger either: a PR from a feature branch runs that branch's code, so keeping
  # it would keep exactly the runs this change is meant to remove.
  #
  # So the run can be asked for by hand - `gh workflow run "Build Tests"` - without inventing a
  # commit to push. (The release workflow deliberately has no manual trigger: it needs a tag, and
  # there is nothing sensible to publish without one.)
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # One job, because there is one product. A second matrix used to build the command-line player
  # with -DTOYBOX_BUILD_PLUGIN=OFF on three platforms; the player is gone, so that job would have
  # configured three trees and built nothing in all of them. What it was for - does the project
  # build everywhere it ships - is this job, and this one also runs the tests.
  plugin-tests:
    name: Plugin and console tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both architectures, because both are shipped: the Linux package comes in an x64 and an
        # arm64 flavour and Windows on ARM gets its own build. The arm64 rows are also the only way
        # either is ever built - no machine here has the toolchain - and arm64 runners cost nothing
        # on a public repository. macOS needs no row of its own: it is built universal (x86_64;arm64)
        # below, which is the same two architectures inside one bundle.
        #
        # Windows arm64 is native here (the runner is an arm64 host with the ARM64 build tools), so
        # `-Arch arm64` builds with the ARM64 toolchain rather than crossing from x64.
        include:
          - { os: windows-2022,     arch: x64 }
          - { os: windows-11-arm,   arch: arm64 }
          - { os: macos-15 }
          - { os: ubuntu-24.04,     arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'powershell' || 'bash' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: startsWith(matrix.os, 'ubuntu')
      # JUCE needs these to build on Linux at all, and xvfb-run gives the GUI tests a display to
      # start against - a headless runner has none, and ScopedJuceInitialiser_GUI wants one.
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb

    - name: Build the plugin and run the console tests (Windows)
      # The same command a developer runs locally: -Test builds the console tests (they are
      # EXCLUDE_FROM_ALL, so naming them was the caller's job until it became the trap that shipped
      # v0.1.0 on a stale binary) and then runs ctest over the list plugin/CMakeLists.txt registers:
      #
      #   vgm_core_test   the mixer maths against analytically known levels, the two volume stages,
      #                   seek/end, the output routing, and the startup-argument rule
      #   vgm_ui_test     the button pixels (shadow, hairline, focus ring, glow, press)
      #   vgm_nsf_test    the NSF header, the ROM map and the expansion-chip detection
      #   vgm_keyboard_test the note layout and the octave shift the keyboard view asks for
      #   vgm_app_test    the window itself: constructed headless, laid out, dumped as text
      #   vgm_mixer_test  the sample-exact render/mix gate, on the song the repository ships
      #   vgm_chip_test   the chip decoders: register writes in, notes out
      #   vgm_opn_test    the YM2612 decoder against libvgm's own YM2612 core (expectations from
      #                   the chip rather than from our reading of its register map)
      #
      # ... and the window scripts, which load that same song.
      if: startsWith(matrix.os, 'windows')
      # -Arch is named out loud so the arm64 row cannot quietly build x64 under emulation and report
      # a pass for an architecture it never touched.
      run: .\build.ps1 -Arch ${{ matrix.arch }} -Test

    - name: Build the plugin (macOS)
      if: matrix.os == 'macos-15'
      # The same steps in plain CMake: build.ps1 is a PowerShell script with MSVC assumptions.
      # Universal on purpose: the runner is Apple Silicon, and a plugin carrying only an arm64
      # slice cannot be loaded on an Intel Mac. Both slices are 64-bit; local builds stay native,
      # this is about what is built for other people.
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        cmake --build build --parallel 3
        # console_tests is defined in plugin/CMakeLists.txt as every binary it hands to add_test().
        # Naming them here instead was the third copy of one list, and the two names missing from
        # all three were never built - ctest reported them as Not Run.
        cmake --build build --target console_tests --parallel 3

    - name: Run the console tests (macOS)
      if: matrix.os == 'macos-15'
      # ctest owns the list (plugin/CMakeLists.txt): the three programs, the mixer gate and one
      # test per window script - the same set Windows runs.
      run: |
        ctest --test-dir build --output-on-failure --output-junit test-results.xml

    - name: Build the plugin (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel 3
        cmake --build build --target console_tests --parallel 3

    - name: Run the console tests (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        xvfb-run -a ctest --test-dir build --output-on-failure --output-junit test-results.xml

    - name: Upload the test report
      # ctest resolves --output-junit against --test-dir, so the macOS/Linux steps pass a bare file
      # name and it lands in build/ - the path this step reads. (build.ps1 passes it absolutely.)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: build/test-results.xml
        if-no-files-found: ignore
        retention-days: 7
