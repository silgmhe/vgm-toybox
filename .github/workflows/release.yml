name: Release

# Only a tag publishes. Everything a release depends on - does the plugin build on all three
# platforms, do the console tests pass - is checked by GHA.yml on every push to master, so the only
# new question on the day of a tag is whether the packaging and the upload work.
on:
  push:
    tags: [ 'v*' ]
  # A manual run builds and uploads the same packages without publishing, so a change to the
  # packaging - a different build container, a new link flag - can be checked against real artefacts
  # before a tag is spent on it. The publish job below only runs for a tag.
  workflow_dispatch:

permissions:
  contents: write    # gh release create writes to this repository

jobs:
  check-tag:
    name: Check the tag against the project version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check the tag against the project version
      # A release called v0.6 whose plugin reports 0.5 is worse than a failed release: the version
      # comes from project(... VERSION ...), which every format reads at compile time. A manual run
      # has no tag to compare against, so it skips this.
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="$(sed -n 's/^project(vgmtoybox VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
        echo "tag: $tag   project: $version"
        test "$tag" = "$version" || {
          echo "::error::tag v$tag does not match project VERSION $version"; exit 1; }

  package-desktop:
    name: Build and package (${{ matrix.os }})
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        # One row per platform and architecture, Release and 64-bit only - the same policy the
        # push-time CI follows, and GHA.yml's matrix says what each removed row was for. The Windows
        # step below asks for Release and for the architecture out loud rather than leaning on
        # build.ps1's defaults, so a release cannot quietly become a debug or an emulated x64 one.
        #
        # macOS rides in one universal bundle (both slices, below) rather than one package per
        # architecture, which is what Mac users expect. The arm64 rows are there because a Raspberry
        # Pi or an ARM server cannot run the x64 package - and note what the Windows arm64 package
        # holds: the VST3 and the standalone only, because JUCE drops AAX on Windows arm64.
        include:
          - { os: windows-latest,   arch: x64,   shell: powershell, package: VGMToybox-windows-x64.zip }
          - { os: windows-11-arm,   arch: arm64, shell: powershell, package: VGMToybox-windows-arm64.zip }
          - { os: macos-latest,                  shell: bash,       package: VGMToybox-macos.zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build, test and package (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        .\build.ps1 -Config Release -Arch ${{ matrix.arch }} -Target vgm_core_test,vgm_ui_test,vgm_app_test -Test

        New-Item -ItemType Directory -Force dist\release | Out-Null
        Copy-Item -Recurse -Force dist\VST3\VGMToybox.vst3 dist\release\
        Copy-Item -Force dist\Standalone\VGMToybox.exe dist\release\
        Copy-Item -Force LICENSE dist\release\
        Compress-Archive -Path dist\release\* -DestinationPath "${{ matrix.package }}" -Force

    - name: Build and package (macOS)
      if: matrix.os == 'macos-latest'
      # Universal: the runner is Apple Silicon, but an Intel Mac cannot load an arm64-only plugin.
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        cmake --build build --parallel 3
        cmake --build build --target vgm_core_test vgm_ui_test vgm_app_test --parallel 3
        ./build/plugin/vgm_core_test
        ./build/plugin/vgm_ui_test
        ./build/plugin/vgm_app_test plugin/Tests/scripts/window-basics.txt

        # Find the bundles rather than guessing the path: JUCE's artefact layout is
        # <target>_artefacts/<config>/<format>/, and the format names are its business, not ours.
        vst3="$(find build -name 'VGMToybox.vst3' -type d | head -1)"
        au="$(find build -name 'VGMToybox.component' -type d | head -1)"
        app="$(find build -name 'VGMToybox.app' -type d | head -1)"
        if [ -z "$vst3" ] || [ -z "$au" ] || [ -z "$app" ]; then
          echo "::error::the build did not produce all three macOS bundles"
          find build -name 'VGMToybox*' | head -20
          exit 1
        fi
        mkdir -p dist/release
        cp -R "$vst3" "$au" "$app" LICENSE dist/release/
        (cd dist/release && zip -ry "../../${{ matrix.package }}" .)

    - name: Upload the package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.package }}
        path: ${{ matrix.package }}

  package-linux:
    name: Build and package (${{ matrix.os }}, glibc 2.35)
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        # The image is chosen for the glibc it carries, not for the runner. Building on the runner
        # itself (ubuntu-24.04 today) makes the package ask for glibc 2.39, which locks out every
        # distribution older than the CI image - Ubuntu 22.04 among them, and 22.04 is a supported
        # LTS. glibc is backwards compatible, so a binary built against 2.35 runs on 2.35 and on
        # everything newer; building here is what sets that floor.
        #
        # Only the glibc floor comes from the container. ALSA and the X11 libraries stay shared and
        # come from the machine that runs the plugin, which is why the packages cannot be static
        # any further than this: the plugin is a .so the host loads.
        include:
          - { os: ubuntu-latest,    arch: x64,   image: ubuntu:22.04, package: VGMToybox-linux-x64.tar.gz }
          - { os: ubuntu-24.04-arm, arch: arm64, image: ubuntu:22.04, package: VGMToybox-linux-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Install git
      # The image is a bare root filesystem without git, and actions/checkout needs it - which is why
      # this step has to come before the checkout.
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install the build dependencies
      # Everything runs as root in the container, so there is no sudo here.
      run: |
        apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
          libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
          libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev xvfb

    - name: Build, test and package (Linux)
      run: |
        # Show what the package will actually demand of the machine that installs it, in the log of
        # the run that produced it rather than in a support thread afterwards.
        #
        # Not `ldd --version | head -1`: the step runs with pipefail, ldd exits with SIGPIPE once
        # head has its line, and the step fails with exit code 141 after printing the line it wanted.
        ldd --version > /tmp/glibc.txt
        head -1 /tmp/glibc.txt

        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel 3
        cmake --build build --target vgm_core_test vgm_ui_test vgm_app_test --parallel 3
        ./build/plugin/vgm_core_test
        xvfb-run -a ./build/plugin/vgm_ui_test
        xvfb-run -a ./build/plugin/vgm_app_test plugin/Tests/scripts/window-basics.txt

        # -print -quit rather than piping through head: the same pipefail coin-flip.
        vst3="$(find build -name 'VGMToybox.vst3' -type d -print -quit)"
        standalone="$(find build -name 'VGMToybox' -type f -executable -print -quit)"
        if [ -z "$vst3" ] || [ -z "$standalone" ]; then
          echo "::error::the build did not produce the Linux plugin and standalone"
          find build -name 'VGMToybox*' | head -20
          exit 1
        fi

        # What the packages actually demand of the machine that installs them, printed in the log of
        # the run that produced them rather than discovered in a support thread. Every line here is
        # also a gate: this is the job that decides whether the container and the link flags still
        # do theirs, and a package that quietly lost them is exactly what nobody checks for.
        plugin="$(find "$vst3" -name '*.so' -print -quit)"

        check_binary () {
          echo "--- $1 ---"

          # Both lists go into files rather than into `grep -q`: grep exits as soon as it matches,
          # the producer dies of SIGPIPE, and with pipefail the pipeline then reports 141 - which
          # an `if` reads as "no match". The gate would pass exactly when it found something.
          grep -ao 'GLIBC_[0-9.]*' "$1" > /tmp/glibc-symbols.txt
          readelf -d "$1" > /tmp/needed.txt

          echo "glibc symbols:"
          sort -Vu /tmp/glibc-symbols.txt | tail -3
          echo "shared libraries:"
          sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' /tmp/needed.txt | sort

          # Built in ubuntu:22.04, so 2.35 is the highest symbol any binary may name. A GLIBC_2.36
          # or newer means the build escaped the container - the runner's own glibc is 2.39.
          if grep -qE 'GLIBC_2\.(3[6-9]|[4-9][0-9])' /tmp/glibc-symbols.txt; then
            echo "::error::$1 asks for a glibc newer than 2.35 - was it built outside the container?"
            exit 1
          fi

          # -static-libstdc++ -static-libgcc (CMakeLists.txt) link the C++ runtime in. If either
          # shows up again, in a symbol or in the NEEDED list, the flags stopped taking effect.
          if grep -aq 'GLIBCXX_' "$1"; then
            echo "::error::$1 still names a GLIBCXX symbol - the C++ runtime is not linked in"
            exit 1
          fi
          if grep -q 'NEEDED.*lib\(stdc++\|c++\|gcc_s\)\.so' /tmp/needed.txt; then
            echo "::error::$1 still loads the C++ runtime as a shared library"
            exit 1
          fi
        }

        check_binary "$standalone"
        check_binary "$plugin"

        mkdir -p dist/release
        cp -R "$vst3" dist/release/
        cp "$standalone" dist/release/
        cp LICENSE dist/release/
        tar -czf "${{ matrix.package }}" -C dist/release .

    - name: Upload the package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.package }}
        path: ${{ matrix.package }}

  release:
    name: Publish the release
    needs: [ package-desktop, package-linux ]
    # A manual run stops after the packages: there is no tag, so there is nothing to publish under.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Download the packages
      uses: actions/download-artifact@v4
      with:
        path: packages
        merge-multiple: true

    - name: Write the release notes
      # The AGPL asks for the source to travel with the binaries, so the notes say where it is; and
      # an unsigned macOS build needs its workaround said out loud rather than discovered.
      run: |
        cat > notes.md <<EOF
        VST3, Audio Unit (macOS only) and standalone builds for Windows, macOS and Linux - x64 and
        arm64 on Windows and Linux, and one universal bundle for macOS.

        **Installing**
        - Windows: put \`VGMToybox.vst3\` in \`C:\\Program Files\\Common Files\\VST3\`, or run \`VGMToybox.exe\`.
          The \`arm64\` package is for Windows on ARM; there the \`x64\` one only runs under emulation.
        - macOS (universal - Apple Silicon and Intel): \`VGMToybox.vst3\` goes to
          \`/Library/Audio/Plug-Ins/VST3\`, \`VGMToybox.component\` to
          \`/Library/Audio/Plug-Ins/Components\`, and \`VGMToybox.app\` runs on its own.
        - Linux: \`VGMToybox.vst3\` goes to \`~/.vst3\`, and the standalone binary runs on its own. Both
          packages install the same way - take the \`x64\` or the \`arm64\` one to match the machine.

        **Linux: Ubuntu 22.04 or newer.** The Linux packages are built inside an Ubuntu 22.04
        container, so they ask for glibc 2.35 and no more than that - glibc is backwards compatible,
        which is what makes one package cover 22.04, 24.04, Debian 12 and later, Fedora 35 and later,
        and current Arch. The C++ runtime is linked statically into both the plugin and the
        standalone, so no \`GLIBCXX_*\` version is asked of the machine. glibc itself stays shared,
        because it is what ALSA, X11 and the host process already use. An older machine reports
        \`GLIBC_2.35 not found\` and has to build
        from source. ALSA has to be installed either way (\`libasound2\` or \`libasound2t64\`), and

            ldd VGMToybox | grep "not found"

        names exactly what is missing.

        **macOS: unsigned and un-notarised.** These bundles have no Apple Developer signature behind
        them, so macOS refuses them at first launch. Either right-click and choose *Open*, or clear
        the quarantine flag:

            xattr -dr com.apple.quarantine VGMToybox.vst3
            xattr -dr com.apple.quarantine VGMToybox.component
            xattr -dr com.apple.quarantine VGMToybox.app

        **Licence.** VGMToybox is AGPL-3.0-or-later, and the complete source for these binaries is
        this repository at this tag:
        https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}
        EOF

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      # This job checks nothing out - it only receives the built packages - so gh has no .git here to
      # read the repository from, and it stopped with "fatal: not a git repository" before it had
      # looked at a single package. Naming the repository is what makes the command independent of
      # the working directory; the token above still decides whether it is allowed to write.
      run: |
        gh release create "$GITHUB_REF_NAME" packages/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "VGMToybox $GITHUB_REF_NAME" \
          --notes-file notes.md
